<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crop Screen</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      user-select: none;
      -webkit-user-drag: none;
      cursor: crosshair;
    }
    #screenshot {
      width: 100%;
      height: 100%;
      object-fit: fill; /* cover entire screen */
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 10;
    }
    #crop-box {
      position: absolute;
      border: 2px dashed #fff;
      background: transparent;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      z-index: 20;
      display: none;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="crop-box"></div>
  <img id="screenshot" src="" />
  <script>
    let startX, startY, endX, endY, isDragging = false;
    const cropBox = document.getElementById('crop-box');
    const overlay = document.getElementById('overlay');
    const screenshot = document.getElementById('screenshot');

    window.cropAPI.onScreenshotData((dataUrl) => {
      screenshot.src = dataUrl;
    });

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // Only left click
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      cropBox.style.left = startX + 'px';
      cropBox.style.top = startY + 'px';
      cropBox.style.width = '0px';
      cropBox.style.height = '0px';
      cropBox.style.display = 'block';
      overlay.style.display = 'none'; // Use box-shadow of crop-box for dimming
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      endX = e.clientX;
      endY = e.clientY;
      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);
      const width = Math.abs(startX - endX);
      const height = Math.abs(startY - endY);
      
      cropBox.style.left = left + 'px';
      cropBox.style.top = top + 'px';
      cropBox.style.width = width + 'px';
      cropBox.style.height = height + 'px';
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const left = Math.min(startX, endX);
      const top = Math.min(startY, endY);
      const width = Math.abs(startX - endX);
      const height = Math.abs(startY - endY);

      if (width > 10 && height > 10) {
        const scale = window.devicePixelRatio || 1;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        // Scale source coordinates to match physical image pixels
        const sx = left * scale;
        const sy = top * scale;
        const sWidth = width * scale;
        const sHeight = height * scale;
        
        ctx.drawImage(screenshot, sx, sy, sWidth, sHeight, 0, 0, width, height);
        const croppedDataUrl = canvas.toDataURL('image/png');
        
        window.cropAPI.finish(croppedDataUrl);
      } else {
        // Cancelled
        window.cropAPI.cancel();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        window.cropAPI.cancel();
      }
    });
  </script>
</body>
</html>
